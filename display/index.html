<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carros e bicicletas</title>
</head>
<style>
    body{
        box-sizing: border-box;
        margin: 0px;
        padding: 0px;
        font-family: Arial, Helvetica, sans-serif;
    }

    h1{
        text-align: center;
        color: black;
    }

    #container-compra{
        max-width: 600px;
        
        margin: auto;
    }

    .filho-compra {
        background-color: black;
        margin-bottom: 20px;
        padding: 30px;
        border-radius: 5px;
    }

    h2{
        color: white;
        margin-top: 0pc;
    }

    p {
        color: gray;
    }

    span {
        color: rgb(230, 184, 0);
    }

    a {
        display: inline-block;
        color: rgb(104, 83, 0);
        text-decoration: none;
        background-color: rgb(230, 184, 0);
        padding: 10px;
        border-radius: 5px;
        font-weight: bold;
    }
</style>
<body>
    <h1>Carros e Bicicletas</h1>
    <div id="container-compra">
        <div class="filho-compra">
            <h2>Carro: <span>R$ 1999</span></h2>
            <p>Carro modelo <span>2045</span>, com <span>200km</span> rodados.</p>
            <a href="#">Comprar Carro</a>
        </div>

        <div class="filho-compra">
            <h2>Bicicleta: <span>R$ 199</span></h2>
            <p>Carro modelo <span>2050</span>, com <span>20km</span> rodados.</p>
            <a href="#">Comprar Bicicleta</a>
        </div>
    </div>
</body>
</html>
