<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carros e Bicicletas</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        main {
            margin: auto;
            padding: 30px;
        }

        section {
            width: 100%;
            height: 100px;
        }

        h1 {
            text-align: center;
        }
    </style>
</head>
<body>
    <main>
        <h1>Carros e Bicicletas</h1>
        <section>
            <h2>Carro: <span>R$1999</span></h2>
            <p>Carro modelo <span>2045</span>, com <span>240km</span> rodados.</p>
            <div class="butao">Comprar Carro</div>
        </section>
        <section>
            <h2>Bicicleta: <span>R$199</span></h2>
            <p>Bicicleta modelo <span>2050</span>, com <span>24km</span> rodados.</p>
            <div class="butao">Comprar Carro</div>
        </section>
    </main>
</body>
</html>
