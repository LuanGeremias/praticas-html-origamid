<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex</title>
    <style>
        div {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        h2 {
            background-color: #e7e7e7;
            padding: 10px;
            flex: 1;
        }
    </style>
</head>
<body>
    <div>
        <h2>O Senhor dos Anéis</h2>
        <h2>Interestelar</h2>
        <h2>O Hobbit</h2>
        <h2>Star Wars</h2>
    </div>
</body>
</html>
